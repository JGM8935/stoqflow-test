<head>
  <title>Stoqflow Test - Meteor Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  {{> login}}
  {{#if currentUser}}
    {{> chat}}
  {{/if}}
</body>

<template name="login">
  <div class="login-box">
    <h2>Inloggen</h2>
    <select id="user-select">
      <option value="">-- Kies gebruiker --</option>
      <option value="userone">userone</option>
      <option value="usertwo">usertwo</option>
      <option value="receiver">receiver</option>
    </select>
    <button id="login-button">Inloggen</button>
    {{#if currentUser}}
      <p>Ingelogd als: <strong>{{currentUser}}</strong> <button id="logout-button">Uitloggen</button></p>
    {{/if}}
  </div>
</template>

<template name="chat">
  <div class="chat-box">
    {{#if isReceiver}}
      <h3>Gesprek met: </h3>
      <select id="conversation-select">
        <option value="userone">userone</option>
        <option value="usertwo">usertwo</option>
      </select>
    {{/if}}

    <div class="messages">
      {{#each messages}}
        <p><strong>{{from}}:</strong> {{text}}</p>
      {{/each}}
    </div>

    <form id="send-form">
      <input type="text" id="messages-text" placeholder="Typ een bericht ..." autocomplete="off" />
      <button type="submit">Verstuur</button>
    </form>
  </div>
</template>
